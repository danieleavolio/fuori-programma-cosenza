name: Diagnostica browser anti-bot

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Browser disponibili
        run: |
          for bin in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v $bin >/dev/null 2>&1; then echo "$bin -> $(command -v $bin)"; fi
          done
          google-chrome --version || true

      - name: Caricamento pagina 18tickets con Chrome
        run: |
          node scripts/browser_fetch.mjs "https://zumpano.andromeda.18tickets.it/" > /tmp/page.html
          echo "byte: $(wc -c < /tmp/page.html)"
          echo "movie--preview: $(grep -c 'movie--preview' /tmp/page.html || true)"
          echo "waf: $(grep -c 'awsWafCookieDomainList' /tmp/page.html || true)"
          head -c 400 /tmp/page.html
