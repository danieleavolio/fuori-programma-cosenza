name: Aggiorna e pubblica su GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Aggiorna ogni 6 ore, inclusa la mezzanotte italiana (23:00, 05:00, 11:00, 17:00 UTC = 00:00, 06:00, 12:00, 18:00 CET)
    - cron: '0 23,5,11,17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aggiorna la programmazione dei cinema
        run: python scripts/update_schedule.py

      - name: Salva programmazione aggiornata nel repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git diff --staged --quiet || (git commit -m "Aggiorna orari cinema [skip ci]" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
