name: Verifica preview SvelteKit

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'scripts/*svelte*'
      - 'scripts/verify_preview.mjs'
      - 'scripts/sync_legacy.mjs'
      - '.github/workflows/svelte-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:preview -- --browser
        env:
          CHROME_BIN: /usr/bin/google-chrome
